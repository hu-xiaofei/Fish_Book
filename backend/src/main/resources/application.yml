spring:
  application:
    name: fishbook-backend
  jackson:
    time-zone: UTC
  jpa:
    open-in-view: false
  session:
    jdbc:
      initialize-schema: never

server:
  servlet:
    session:
      timeout: 24h
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: lax
        secure: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
