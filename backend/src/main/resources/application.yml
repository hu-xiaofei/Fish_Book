spring:
  application:
    name: fishbook-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    time-zone: UTC
  jpa:
    open-in-view: false
  session:
    jdbc:
      initialize-schema: never

fishbook:
  media:
    enabled: false

server:
  servlet:
    session:
      timeout: 24h
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: lax
        secure: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
