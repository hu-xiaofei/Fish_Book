spring:
  application:
    name: fishbook-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    time-zone: UTC
  jpa:
    open-in-view: false
  session:
    jdbc:
      initialize-schema: never

fishbook:
  admin:
    bootstrap:
      enabled: false
  media:
    enabled: false

server:
  servlet:
    session:
      timeout: 24h
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: lax
        secure: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# SDK errors and transport diagnostics may contain credentials, request headers,
# object keys, or response bodies. Keep application-level generic failure logs.
logging:
  level:
    com.aliyun.oss: OFF
    com.aliyun.credentials: OFF
    org.apache.http: OFF
    org.apache.http.headers: OFF
    org.apache.http.wire: OFF
    okhttp3: OFF
    jdk.httpclient.HttpClient: OFF
