name: fishbook-private-ecs
services:
  backend:
    build: ./backend
    user: "10001:10001"
    scale: 1
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://rm-bp1pgdmw41u3i6r98.mysql.rds.aliyuncs.com:3306/fishbook?connectionTimeZone=UTC&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: fishbook_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "true"
      FISHBOOK_MEDIA_ENABLED: "true"
      FISHBOOK_MEDIA_PROVIDER: filesystem
      FISHBOOK_MEDIA_FILESYSTEM_ROOT: /data/photos
      FISHBOOK_ADMIN_BOOTSTRAP_ENABLED: ${FISHBOOK_ADMIN_BOOTSTRAP_ENABLED:?required}
      FISHBOOK_ADMIN_EMAIL: ${FISHBOOK_ADMIN_EMAIL:?required}
      FISHBOOK_ADMIN_PASSWORD: ${FISHBOOK_ADMIN_PASSWORD:?required}
      FISHBOOK_ADMIN_NICKNAME: ${FISHBOOK_ADMIN_NICKNAME:?required}
    volumes:
      - type: bind
        source: /opt/fishbook/data/photos
        target: /data/photos
        bind:
          create_host_path: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  frontend:
    build:
      context: ./frontend
      args:
        NGINX_CONFIG: nginx.private-ecs.conf
    user: "101:101"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - type: bind
        source: /opt/fishbook/tls
        target: /etc/fishbook/tls
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--no-check-certificate", "--output-document=/dev/null", "https://127.0.0.1:8443/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
