services:
  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?connectionTimeZone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      FISHBOOK_MEDIA_ENABLED: "true"
      FISHBOOK_MEDIA_ENDPOINT: http://minio:9000
      FISHBOOK_MEDIA_ACCESS_KEY: ${MINIO_ROOT_USER}
      FISHBOOK_MEDIA_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      FISHBOOK_MEDIA_BUCKET: ${MINIO_BUCKET}
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
